# Terbitkan Dunia Cilik ke GitHub Pages
name: Terbit ke GitHub Pages

on:
  push:
    branches: [main, claude/dunia-cilik-educational-app-lizim0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sahkan kesemua 750 level
        run: node tests/generators.test.mjs
      - name: Uji pemilihan suara
        run: node tests/voice.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sediakan fail laman
        run: |
          node tools/build-sw.mjs
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons fonts visual-assets jualan _site/
          mkdir -p _site/audio/ms-MY && cp audio/ms-MY/manifest.json audio/ms-MY/catalog.json _site/audio/ms-MY/
          cp -r studio _site/
          find audio/ms-MY -name '*.mp3' -exec cp {} _site/audio/ms-MY/ \;
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
